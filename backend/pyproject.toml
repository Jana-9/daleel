[project]
name = "daleel-backend"
version = "0.1.0"
description = "Daleel backend: ask Arabic and English documents questions with cited answers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
